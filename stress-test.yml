config:
  target: "http://localhost:3000"
  plugins:
    ensure: {}
  phases:
    - duration: 20
      arrivalRate: 5
      name: "1. 🧪 Fase de Calentamiento (Tráfico Base)"
    - duration: 30
      arrivalRate: 15
      rampTo: 50
      name: "2. 🧪 Fase de Saturación Máxima (Pico de Carga)"
  ensure:
    thresholds:
      # El 99% de las transacciones debe procesarse en < 200ms (Comportamiento temporal)
      - "http.response_time.p99": 200
    # No se permite más del 1% de caídas del socket HTTP
    maxErrorRate: 1

scenarios:
  - name: "Inundación transaccional perimetral (Payloads Mixtos Zod)"
    flow:
      # Flujo A: Datos Correctos -> Evalúa la tubería completa refactorizada
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Mauro Ramos"
            cargo: "Software Architect"
            departamento: "TI"
            sueldo: 4200
          capture:
            # La API mapea la entidad y responde { data: { id, ... } } (wrapper successResponse).
            json: "$.data.id"
            as: "employeeId"
      - think: 0.1
      # Flujo B: Datos Corruptos -> Evalúa el rechazo inmediato y óptimo del DTO Zod
      - post:
          url: "/api/v1/employees"
          json:
            nombre: "Al"
            cargo: "Dev"
            departamento: "TI"
            sueldo: -500 # Campo ilegal
